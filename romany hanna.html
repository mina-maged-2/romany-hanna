<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card - Romany Hanna</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --border-color: #e2d7c3;
            --text-primary: #2a241e;
            --text-secondary: #6e6557;
            --gold-primary: #c29235;
            --gold-dark: #8a611c;
            --gold-light: #f4ece1;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(194, 146, 53, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(138, 97, 28, 0.1) 0px, transparent 50%);
        }

        .vcard-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 12px 30px rgba(138, 97, 28, 0.12);
        }

        /* Company Logo Header */
        .company-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .company-logo {
            max-width: 190px;
            height: auto;
            margin: 0 auto 4px auto;
            display: block;
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar-placeholder {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: var(--gold-light);
            border: 3px solid var(--gold-primary);
            margin: 0 auto 10px auto;
            box-shadow: 0 4px 12px rgba(194, 146, 53, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold-dark);
        }

        .name {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .title {
            font-size: 0.88rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Primary Call to Action Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(138, 97, 28, 0.25);
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--gold-dark);
            border: 2px solid var(--gold-primary);
        }

        /* Highlighted Feature Button */
        .btn-highlight {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            border: 1px solid var(--gold-primary);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .btn-highlight i {
            color: var(--gold-primary);
        }

        /* Direct Contact Grid */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

            align-items: center;
